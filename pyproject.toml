[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocore"
version = "0.3.0"
description = "EEG runtime with Xavier inference artifacts, causal signal preparation, multimodal proposals, and bounded control integration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuroCore contributors" }]
keywords = ["eeg", "bci", "neurotechnology", "agent", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.27"]
desktop = ["fastapi>=0.100", "uvicorn[standard]>=0.27", "Pillow>=11", "PyAutoGUI>=0.9.54"]
xavier = ["safetensors>=0.8", "Pillow>=11"]
xavier-mlx = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm==0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers==5.24.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy==2.5.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "safetensors==0.8.0",
    "Pillow>=11",
]
io = [
    "antio>=0.5",
    "h5py>=3.10",
    "mne>=1.7",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pynwb>=2.7",
    "pyreadr>=0.5",
    "pyxdf>=1.16",
    "scipy>=1.11",
    "torch>=2.1",
    "xlrd>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.25",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=6.0",
]

[project.scripts]
neurocore = "neurocore.cli:main"

[project.urls]
Homepage = "https://github.com/yasufumi-nakata/NeuroCore"
Repository = "https://github.com/yasufumi-nakata/NeuroCore"
Issues = "https://github.com/yasufumi-nakata/NeuroCore/issues"
Documentation = "https://www.yasufumi.net/NeuroCore/"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["neurocore*"]

[tool.setuptools.package-data]
"neurocore" = ["web/*.html", "web/assets/*"]
"neurocore.xavier" = ["catalog.json", "packagedcatalog.json", "assets/*.json", "assets/source30/*.json", "assets/source30/*.safetensors", "assets/source30/*.md", "assets/source30/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
