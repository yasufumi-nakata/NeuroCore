[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocore"
version = "0.1.0"
description = "EEG-to-control runtime primitives for mouse, keyboard, and AI-agent orchestration without bundled decoder weights."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuroCore contributors" }]
keywords = ["eeg", "bci", "neurotechnology", "agent", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.27"]
io = [
    "antio>=0.5",
    "h5py>=3.10",
    "mne>=1.7",
    "pynwb>=2.7",
    "pyreadr>=0.5",
    "pyxdf>=1.16",
    "scipy>=1.11",
    "torch>=2.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.25",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=6.0",
]

[project.scripts]
neurocore = "neurocore.cli:main"

[project.urls]
Homepage = "https://github.com/yasufumi-nakata/NeuroCore"
Repository = "https://github.com/yasufumi-nakata/NeuroCore"
Issues = "https://github.com/yasufumi-nakata/NeuroCore/issues"
Documentation = "https://www.yasufumi.net/NeuroCore/"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["neurocore*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
