name: Pickle trust boundary maintenance once
on:
  push:
    branches: [automation/pickle-trust-boundary-20261106]
    paths: [.github/workflows/pickle-maintenance-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply narrow trust-boundary edits
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('backend/neurocore/loaders.py')
          text = path.read_text()
          def replace_function(source, name, replacements):
              node = next(n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef) and n.name == name)
              lines = source.splitlines(keepends=True)
              block = ''.join(lines[node.lineno - 1:node.end_lineno])
              for old, new in replacements:
                  assert block.count(old) == 1, (name, old)
                  block = block.replace(old, new)
              return ''.join(lines[:node.lineno - 1]) + block + ''.join(lines[node.end_lineno:])
          flag = ('    mne_preload: bool = True,\n', '    mne_preload: bool = True,\n    trusted_pickle: bool = False,\n')
          text = replace_function(text, 'load', [flag, ('return load_directory(resolved, sampling_rate=sampling_rate, mne_preload=mne_preload)', 'return load_directory(resolved, sampling_rate=sampling_rate, mne_preload=mne_preload, trusted_pickle=trusted_pickle)'), ('return load_pickle(resolved, sampling_rate=sampling_rate, channel_names=channel_names)', 'return load_pickle(resolved, sampling_rate=sampling_rate, channel_names=channel_names, trusted=trusted_pickle)')])
          text = replace_function(text, 'load_directory', [flag, ('return load(files[0], sampling_rate=sampling_rate, mne_preload=mne_preload)', 'return load(files[0], sampling_rate=sampling_rate, mne_preload=mne_preload, trusted_pickle=trusted_pickle)')])
          text = replace_function(text, 'load_pickle', [('    unit: str = "uV",\n', '    unit: str = "uV",\n    trusted: bool = False,\n'), ('    """Load a numeric EEG payload through the restricted pickle loader."""\n', '    """Load trusted numeric EEG data; restricted globals are not a sandbox."""\n    if trusted is not True:\n        raise ValueError(\n            "pickle loading is disabled by default; use trusted=True only for verified local files"\n        )\n')])
          ast.parse(text)
          path.write_text(text)
          path = Path('backend/tests/test_universal_loaders.py')
          text = path.read_text()
          assert text.count('load_pickle(path') == 4, 'Review legacy fixture calls before changing their trust flags'
          path.write_text(text.replace('load_pickle(path', 'load_pickle(path, trusted=True'))
          note = '\n\n## Pickle loading is disabled by default\n\nThe restricted unpickler is not a resource sandbox. Generic, directory and CLI paths refuse pickle before deserialization unless a caller deliberately opts in for a verified local file. See [the trust-boundary migration guide](docs/pickle-trust-boundary.md). Explicit trust does not make hostile pickle input safe.\n'
          for name in ('README.md', 'SECURITY.md'):
              path = Path(name)
              path.write_text(path.read_text() + note)
          PY
      - name: Validate security regression and existing behavior
        run: |
          python -m pip install -e '.[dev,server]'
          python -m ruff check backend scripts
          python -m pytest backend/tests -q
          python -m neurocore.cli self-test --json
          git diff --check
      - name: Commit only verified trust-boundary changes
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/neurocore/loaders.py backend/tests/test_universal_loaders.py README.md SECURITY.md
          git commit -m 'security: require explicit verified trust before pickle deserialization'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/pickle-trust-boundary-20261106
