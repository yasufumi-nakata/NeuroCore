name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev,server]"

      - name: Check repository health
        run: python scripts/oss_health_check.py

      - name: Build package artifacts
        run: python scripts/build_package_artifacts.py

      - name: Build public pages
        run: python scripts/build_pages.py

      - name: Validate public pages
        run: python scripts/validate_pages.py
