name: Dependency maintenance once
on:
  push:
    branches: [automation/dependency-reconciliation-20261106]
    paths: [.github/workflows/dependency-maintenance-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Update only dependencies already proposed in pending PRs
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact vite@8.3.5 @vitejs/plugin-react@6.1.1 lucide-react@1.46.0 react@19.3.0 react-dom@19.3.0
          npm update source-map-js --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {vite: '8.3.5', '@vitejs/plugin-react': '6.1.1', 'lucide-react': '1.46.0', react: '19.3.0', 'react-dom': '19.3.0'};
          for (const [name, version] of Object.entries(expected)) {
            assert.equal(lock.packages[`node_modules/${name}`].version, version, name);
          }
          const sourceMaps = Object.entries(lock.packages).filter(([path]) => path.endsWith('/source-map-js'));
          assert.ok(sourceMaps.length, 'source-map-js dependency must be present');
          for (const [path, info] of sourceMaps) {
            assert.equal(info.version, '1.2.2', path);
          }
          JS
          npm ls --depth=0
          npm run build
          npm audit --audit-level=high
      - name: Commit only verified dependency manifests
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'deps: reconcile React pair, Vite, icons and source-map security fix'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/dependency-reconciliation-20261106
