name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Inspect repository security capability
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api repos/${{ github.repository }} --jq '.private')
          advanced_security=$(gh api repos/${{ github.repository }} --jq '.security_and_analysis.advanced_security.status // "disabled"')
          echo "private=$private" >> "$GITHUB_OUTPUT"
          echo "advanced_security=$advanced_security" >> "$GITHUB_OUTPUT"

      - name: Skip CodeQL when private repository has no Advanced Security
        if: steps.repository.outputs.private == 'true' && steps.repository.outputs.advanced_security != 'enabled'
        run: |
          echo "CodeQL upload requires GitHub Advanced Security for private repositories."
          echo "advanced_security=${{ steps.repository.outputs.advanced_security }}"

      - uses: actions/checkout@v6
        if: steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled'

      - name: Initialize CodeQL
        if: steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Install frontend dependencies
        if: (steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled') && matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for analysis
        if: (steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled') && matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        if: steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
