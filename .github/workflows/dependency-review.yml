name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository security capability
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api repos/${{ github.repository }} --jq '.private')
          advanced_security=$(gh api repos/${{ github.repository }} --jq '.security_and_analysis.advanced_security.status // "disabled"')
          echo "private=$private" >> "$GITHUB_OUTPUT"
          echo "advanced_security=$advanced_security" >> "$GITHUB_OUTPUT"

      - name: Skip Dependency Review when private repository has no Advanced Security
        if: steps.repository.outputs.private == 'true' && steps.repository.outputs.advanced_security != 'enabled'
        run: |
          echo "Dependency Review requires GitHub Advanced Security for private repositories."
          echo "advanced_security=${{ steps.repository.outputs.advanced_security }}"

      - uses: actions/checkout@v6
        if: steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled'

      - uses: actions/dependency-review-action@v5
        if: steps.repository.outputs.private != 'true' || steps.repository.outputs.advanced_security == 'enabled'
        with:
          fail-on-severity: high
